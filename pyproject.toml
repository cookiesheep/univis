[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "univis"
version = "0.1.0"
description = "Transformer inference redundancy diagnostic and visualization toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "numpy",
    "fastapi>=0.100",
    "uvicorn",
    "websockets",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
