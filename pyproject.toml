[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "univis"
version = "0.7.1"
description = "Layer-wise A/B for LLMs: find the first layer where two runs diverge (MetaX C500 / NVIDIA / CPU), plus redundancy profiling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = [
    "transformer",
    "llm",
    "inference",
    "redundancy",
    "observability",
    "profiling",
    "visualization",
    "mxmaca",
    "domestic-gpu",
    "edge-computing",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "fastapi>=0.100",
    "uvicorn",
    "websockets",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
univis = "univis.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "transformers",
    "starlette",
    "websockets",
]
hf = [
    "transformers",
]
server = [
    "fastapi>=0.100",
    "uvicorn",
    "websockets",
]
dashboard = []  # Separate npm project in dashboard/

[project.urls]
Homepage = "https://github.com/cookiesheep/univis"
Repository = "https://github.com/cookiesheep/univis"
Changelog = "https://github.com/cookiesheep/univis/releases"
Issues = "https://github.com/cookiesheep/univis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
univis = ["data/echarts.min.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
