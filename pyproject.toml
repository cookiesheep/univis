[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "univis"
version = "0.1.0"
description = "Transformer inference redundancy diagnostic and visualization toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "numpy",
    "fastapi>=0.100",
    "uvicorn",
    "websockets",
    "jinja2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
univis = "univis.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "transformers",
]
server = [
    "fastapi>=0.100",
    "uvicorn",
    "websockets",
]
dashboard = []  # Separate npm project in dashboard/

[project.urls]
Homepage = "https://github.com/cookiesheep/univis"
Repository = "https://github.com/cookiesheep/univis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
univis = ["data/echarts.min.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
