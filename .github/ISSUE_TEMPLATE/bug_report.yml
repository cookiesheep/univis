name: Bug report
description: Something in UniVis does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: Command or code you ran, what you expected, what you got (full traceback if any)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions / 版本
      placeholder: univis 0.7.1 · torch 2.x · transformers 4.x · Python 3.x · OS
    validations:
      required: true
